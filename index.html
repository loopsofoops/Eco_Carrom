<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>CARROM 3D // PLOT WARS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root {
  --surface: #fffdf9;
  --ink: #121216;
  --ink-muted: #5a5a66;
  --accent: #ff4500;
  --cyan: #00e5ff;
  --magenta: #f72585;
  --gold: #ffb700;
  --danger: #ff1744;
  --border-w: 2.5px;
  --shadow: 4px 4px 0px #121216;
  --shadow-sm: 2.5px 2.5px 0px #121216;
  --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  border-radius: 0 !important;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  max-width: 100vw;
  height: 100dvh;
  overflow: hidden;
  position: fixed;
  inset: 0;
  background: #f4ead8;
  color: var(--ink);
  font-family: var(--font-sans);
}

#app {
  position: relative;
  width: 100%;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  overflow: hidden;
}

#stage-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
  z-index: 1;
}

/* SHARP BRUTALIST TOP BAR */
.top-bar {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  padding: calc(10px + env(safe-area-inset-top, 0px)) 10px 6px;
  pointer-events: none;
}

.score-group {
  display: flex;
  align-items: center;
  gap: 6px;
  pointer-events: auto;
  flex-wrap: nowrap;
}

.player-pill {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-width: 90px;
  height: 40px;
  padding: 3px 8px;
  background: var(--surface);
  border: var(--border-w) solid var(--ink);
  box-shadow: var(--shadow-sm);
  transition: transform 0.12s ease, background-color 0.12s ease;
}

.player-pill.active {
  background: var(--gold);
  transform: translate(-1px, -1px);
  box-shadow: var(--shadow);
}

.pill-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 5px;
}

.owner-swatch {
  width: 9px;
  height: 9px;
  border: 2px solid var(--ink);
  flex-shrink: 0;
}

.owner-swatch.p1-color { background: var(--cyan); }
.owner-swatch.p2-color { background: var(--magenta); }

.player-name {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.04em;
  color: var(--ink);
}

.player-pts {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 800;
  color: var(--ink);
}

.player-pts.negative {
  color: var(--danger);
}

.wallet-mini {
  font-family: var(--font-mono);
  font-size: 8.5px;
  font-weight: 800;
  color: var(--ink-muted);
  letter-spacing: 0.01em;
  margin-top: 1px;
  white-space: nowrap;
}

.player-pill.active .wallet-mini {
  color: var(--ink);
}

.top-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  pointer-events: auto;
  flex-shrink: 0;
}

.buy-top-btn {
  appearance: none;
  height: 40px;
  padding: 0 10px;
  background: var(--surface);
  color: var(--ink);
  border: var(--border-w) solid var(--ink);
  box-shadow: var(--shadow-sm);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.03em;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}

.buy-top-btn.can-afford {
  background: var(--cyan);
  color: var(--ink);
}

.buy-top-btn:disabled {
  opacity: 0.45;
  pointer-events: none;
}

.buy-top-btn:active {
  background: var(--ink);
  color: var(--surface);
  transform: translate(1px, 1px);
  box-shadow: 1px 1px 0px var(--ink);
}

.icon-btn {
  pointer-events: auto;
  appearance: none;
  width: 40px;
  height: 40px;
  background: var(--surface);
  border: var(--border-w) solid var(--ink);
  box-shadow: var(--shadow-sm);
  color: var(--ink);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
}

.icon-btn:active,
.icon-btn.active {
  background: var(--ink);
  color: var(--surface);
  transform: translate(1px, 1px);
  box-shadow: 1px 1px 0px var(--ink);
}

/* FLOATING TOAST */
.toast-pill {
  position: absolute;
  top: calc(60px + env(safe-area-inset-top, 0px));
  left: 50%;
  transform: translateX(-50%) translateY(-6px);
  z-index: 12;
  background: var(--ink);
  color: var(--surface);
  border: 2px solid var(--ink);
  box-shadow: var(--shadow-sm);
  padding: 5px 14px;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.05em;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.14s ease, transform 0.14s ease;
  white-space: nowrap;
}

.toast-pill.visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* JUICY POWER HUD BAR */
.power-hud {
  position: absolute;
  bottom: calc(82px + env(safe-area-inset-bottom, 0px));
  left: 50%;
  transform: translateX(-50%);
  z-index: 12;
  width: 248px;
  background: var(--surface);
  border: var(--border-w) solid var(--ink);
  box-shadow: var(--shadow);
  padding: 6px 8px;
  display: flex;
  flex-direction: column;
  gap: 5px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.12s ease;
}

.power-hud.visible {
  opacity: 1;
}

.power-hud-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 800;
}

.power-bar-outer {
  width: 100%;
  height: 12px;
  background: #e4e2dd;
  border: 2px solid var(--ink);
  overflow: hidden;
  position: relative;
}

.power-bar-fill {
  height: 100%;
  width: 0%;
  background: var(--accent);
  transition: background-color 0.08s ease;
}

/* BOTTOM ERGONOMIC DOCK */
.bottom-dock {
  position: relative;
  z-index: 10;
  display: flex;
  flex-direction: column;
  padding: 8px 12px calc(14px + env(safe-area-inset-bottom, 0px));
  pointer-events: none;
  max-width: 520px;
  width: 100%;
  margin: 0 auto;
}

.dock-card {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px;
  background: var(--surface);
  border: var(--border-w) solid var(--ink);
  box-shadow: var(--shadow);
}

/* BASELINE POSITION SLIDER */
.slider-track {
  position: relative;
  flex: 1;
  height: 40px;
  background: #ebe6dc;
  border: 2px solid var(--ink);
  display: flex;
  align-items: center;
  padding: 0 20px;
  touch-action: none;
  cursor: pointer;
}

.slider-line {
  width: 100%;
  height: 4px;
  background: var(--ink);
}

.slider-thumb {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 28px;
  height: 28px;
  transform: translate(-50%, -50%);
  background: var(--surface);
  border: 2.5px solid var(--ink);
  box-shadow: 2px 2px 0px var(--ink);
  pointer-events: none;
}

.slider-thumb::after {
  content: '';
  position: absolute;
  inset: 5px;
  background: var(--accent);
  border: 1.5px solid var(--ink);
}

.slider-thumb.blocked {
  background: var(--danger);
}

/* PAN BUTTON & MODE SWITCH BUTTON */
.pan-btn {
  appearance: none;
  height: 40px;
  padding: 0 11px;
  background: var(--surface);
  color: var(--ink);
  border: 2px solid var(--ink);
  box-shadow: var(--shadow-sm);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 800;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  cursor: pointer;
}

.pan-btn.active,
.pan-btn:active {
  background: var(--cyan);
  color: var(--ink);
  transform: translate(1px, 1px);
  box-shadow: 1px 1px 0px var(--ink);
}

.mode-switch-btn {
  appearance: none;
  height: 40px;
  min-width: 104px;
  padding: 0 12px;
  border: 2px solid var(--ink);
  background: var(--accent);
  color: #ffffff;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.04em;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
}

.mode-switch-btn:active {
  transform: translate(1px, 1px);
  box-shadow: 1px 1px 0px var(--ink);
}

.mode-switch-btn.strike-active {
  background: var(--ink);
  color: var(--gold);
}

.mode-switch-btn:disabled {
  opacity: 0.4;
  pointer-events: none;
}

/* SHARP MODALS (SETTINGS, BUY PLOT, & BANKRUPT SELL/FORFEIT) */
.menu-backdrop {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: rgba(18, 18, 22, 0.65);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.14s ease;
}

.menu-backdrop.open {
  opacity: 1;
  pointer-events: auto;
}

.menu-sheet {
  width: 100%;
  max-width: 356px;
  max-height: 90dvh;
  overflow-y: auto;
  background: var(--surface);
  border: 3px solid var(--ink);
  box-shadow: 8px 8px 0px var(--ink);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.menu-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 2px solid var(--ink);
  padding-bottom: 8px;
}

.menu-title {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.05em;
}

.menu-section {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.menu-label {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 800;
  color: var(--ink-muted);
  letter-spacing: 0.06em;
  display: flex;
  justify-content: space-between;
}

.seg-group {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
}

.seg-btn {
  appearance: none;
  border: 2px solid var(--ink);
  height: 36px;
  background: #ebe6dc;
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 800;
  cursor: pointer;
}

.seg-btn.active {
  background: var(--gold);
  color: var(--ink);
  box-shadow: 2px 2px 0px var(--ink);
}

.menu-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.action-btn {
  appearance: none;
  height: 40px;
  border: 2px solid var(--ink);
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow-sm);
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 800;
  cursor: pointer;
}

.action-btn.primary {
  background: var(--accent);
  color: #ffffff;
}

.action-btn.danger-btn {
  background: var(--danger);
  color: #ffffff;
}

.action-btn:disabled {
  opacity: 0.35;
  pointer-events: none;
}

.action-btn:active {
  transform: translate(1px, 1px);
  box-shadow: 1px 1px 0px var(--ink);
}

/* BUY & SELL PLOT MODAL STYLES */
.tier-strip {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 5px;
}

.tier-chip {
  padding: 5px 4px;
  border: 2px solid var(--ink);
  background: #ebe6dc;
  font-family: var(--font-mono);
  font-size: 9.5px;
  font-weight: 800;
  text-align: center;
  opacity: 0.5;
}

.tier-chip.unlocked {
  background: var(--gold);
  opacity: 1;
  box-shadow: 2px 2px 0px var(--ink);
}

.tier-chip.done {
  background: #10b981;
  color: #ffffff;
  opacity: 1;
}

.plot-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
}

.plot-card {
  appearance: none;
  padding: 8px;
  border: 2px solid var(--ink);
  background: var(--surface);
  text-align: left;
  font-family: var(--font-mono);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 3px;
  box-shadow: 2px 2px 0px var(--ink);
}

.plot-card.selected {
  background: var(--gold);
  transform: translate(-1px, -1px);
  box-shadow: 3px 3px 0px var(--ink);
}

.plot-card.owned-p1 {
  background: var(--cyan);
  pointer-events: none;
}

.plot-card.owned-p2 {
  background: var(--magenta);
  color: #ffffff;
  pointer-events: none;
}

.plot-card-name {
  font-size: 11px;
  font-weight: 800;
}

.plot-card-status {
  font-size: 9px;
  font-weight: 700;
  opacity: 0.85;
}

.coin-pay-list {
  display: flex;
  flex-direction: column;
  gap: 5px;
  background: #ebe6dc;
  border: 2px solid var(--ink);
  padding: 8px;
}

.coin-pay-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 800;
}

.coin-stepper {
  display: flex;
  align-items: center;
  gap: 6px;
}

.step-btn {
  appearance: none;
  width: 26px;
  height: 26px;
  border: 2px solid var(--ink);
  background: var(--surface);
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
}

.step-btn:active {
  background: var(--ink);
  color: var(--surface);
}
</style>
</head>
<body>
<div id="app">
  <canvas id="stage-canvas"></canvas>

  <!-- TOP MINIMALIST SCOREBOARD & BUY BUTTON -->
  <header class="top-bar">
    <div class="score-group">
      <div class="player-pill active" id="pill-p1">
        <div class="pill-top">
          <span style="display:flex;align-items:center;gap:4px;">
            <span class="owner-swatch p1-color"></span>
            <span class="player-name">P1</span>
          </span>
          <span class="player-pts" id="pts-p1">0</span>
        </div>
        <div class="wallet-mini" id="wallet-p1">B:0 W:0 Q:0</div>
      </div>

      <div class="player-pill" id="pill-p2">
        <div class="pill-top">
          <span style="display:flex;align-items:center;gap:4px;">
            <span class="owner-swatch p2-color"></span>
            <span class="player-name" id="name-p2">AI</span>
          </span>
          <span class="player-pts" id="pts-p2">0</span>
        </div>
        <div class="wallet-mini" id="wallet-p2">B:0 W:0 Q:0</div>
      </div>
    </div>

    <div class="top-actions">
      <button type="button" class="buy-top-btn" id="btn-open-buy">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square">
          <rect x="3" y="3" width="18" height="18"></rect>
          <path d="M12 8v8M8 12h8"></path>
        </svg>
        <span id="label-buy-top">BUY (50)</span>
      </button>

      <button type="button" class="icon-btn" id="btn-menu" aria-label="Menu">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square">
          <line x1="4" y1="7" x2="20" y2="7"></line>
          <line x1="4" y1="12" x2="20" y2="12"></line>
          <line x1="4" y1="17" x2="20" y2="17"></line>
        </svg>
      </button>
    </div>
  </header>

  <div class="toast-pill" id="toast-pill">P1 TURN</div>

  <!-- LIVE POWER BAR HUD -->
  <div class="power-hud" id="power-hud">
    <div class="power-hud-top">
      <span id="power-label">POWER</span>
      <span id="power-val">0%</span>
    </div>
    <div class="power-bar-outer">
      <div class="power-bar-fill" id="power-fill"></div>
    </div>
  </div>

  <!-- BOTTOM DOCK -->
  <footer class="bottom-dock">
    <div class="dock-card">
      <div class="slider-track" id="slider-track">
        <div class="slider-line"></div>
        <div class="slider-thumb" id="slider-thumb"></div>
      </div>

      <button type="button" class="pan-btn" id="btn-pan" title="Pan Camera">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="square">
          <path d="M12 2v20M2 12h20M12 2l-3 3M12 2l3 3M12 22l-3-3M12 22l3-3M2 12l3-3M2 12l3 3M22 12l-3-3M22 12l-3 3"/>
        </svg>
        <span>PAN</span>
      </button>

      <button type="button" class="mode-switch-btn" id="btn-mode-toggle">
        <svg id="icon-mode" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square">
          <rect x="3" y="3" width="18" height="18"></rect>
          <rect x="9" y="9" width="6" height="6"></rect>
        </svg>
        <span id="label-mode">STRIKE</span>
      </button>
    </div>
  </footer>

  <!-- BUY PLOT MODAL (3 TIERS: LINES 50 -> RECTS 100 -> HOLES 150) -->
  <div class="menu-backdrop" id="buy-backdrop">
    <div class="menu-sheet">
      <div class="menu-header">
        <span class="menu-title" id="buy-modal-title">BUY PLOT // P1</span>
        <button type="button" class="icon-btn" id="btn-buy-close" style="width:30px;height:30px;box-shadow:none;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="tier-strip">
        <div class="tier-chip" id="tchip-0">1.LINES 50</div>
        <div class="tier-chip" id="tchip-1">2.RECTS 100</div>
        <div class="tier-chip" id="tchip-2">3.HOLES 150</div>
      </div>

      <div class="menu-section">
        <div class="menu-label">
          <span id="plot-tier-title">SELECT PLOT (COST: 50)</span>
          <span id="buyer-bank-label">BANK: 0</span>
        </div>
        <div class="plot-grid" id="plot-grid"></div>
      </div>

      <div class="menu-section">
        <div class="menu-label">
          <span>PUT MONEY ON MIDDLE OF BOARD</span>
          <span id="pay-sum-label">0 / 50</span>
        </div>
        <div class="coin-pay-list">
          <div class="coin-pay-row">
            <span>BLACK (10) <small id="own-b-lbl">[0]</small></span>
            <div class="coin-stepper">
              <button type="button" class="step-btn" id="pay-b-minus">&minus;</button>
              <span id="pay-b-val">0</span>
              <button type="button" class="step-btn" id="pay-b-plus">&plus;</button>
            </div>
          </div>
          <div class="coin-pay-row">
            <span>WHITE (20) <small id="own-w-lbl">[0]</small></span>
            <div class="coin-stepper">
              <button type="button" class="step-btn" id="pay-w-minus">&minus;</button>
              <span id="pay-w-val">0</span>
              <button type="button" class="step-btn" id="pay-w-plus">&plus;</button>
            </div>
          </div>
          <div class="coin-pay-row">
            <span>QUEEN (50) <small id="own-q-lbl">[0]</small></span>
            <div class="coin-stepper">
              <button type="button" class="step-btn" id="pay-q-minus">&minus;</button>
              <span id="pay-q-val">0</span>
              <button type="button" class="step-btn" id="pay-q-plus">&plus;</button>
            </div>
          </div>
        </div>
      </div>

      <button type="button" class="action-btn primary" id="btn-confirm-buy" style="width:100%;">BUY PLOT &amp; PLACE ON BOARD</button>
    </div>
  </div>

  <!-- BANKRUPT // SELL PLOT OR FORFEIT MODAL -->
  <div class="menu-backdrop" id="sell-backdrop">
    <div class="menu-sheet">
      <div class="menu-header">
        <span class="menu-title" id="sell-modal-title">BANKRUPT // SELL PLOT OR FORFEIT</span>
      </div>

      <div class="menu-section">
        <div class="menu-label">

<script>
(() => {
  'use strict';

  // =========================================================================
  // 1. SYNTHESIZED WEB AUDIO & HAPTICS
  // =========================================================================
  class AudioEngine {
    constructor() {
      this.ctx = null;
      this.enabled = true;
    }

    init() {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) this.ctx = new AC();
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume().catch(() => {});
      }
    }

    vibrate(ms) {
      if (this.enabled && navigator.vibrate) {
        try { navigator.vibrate(ms); } catch (_) {}
      }
    }

    clack(intensity = 0.6, pitch = 1.0) {
      if (!this.enabled) return;
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const vol = Math.min(1.0, Math.max(0.04, intensity)) * 0.48;

      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      const freq = (540 + Math.random() * 140) * pitch;
      osc.frequency.setValueAtTime(freq, now);
      osc.frequency.exponentialRampToValueAtTime(freq * 0.24, now + 0.042);

      gain.gain.setValueAtTime(vol, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.045);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.05);
    }

    rail(intensity = 0.6) {
      if (!this.enabled) return;
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.exponentialRampToValueAtTime(58, now + 0.075);
      gain.gain.setValueAtTime(Math.min(0.55, intensity * 0.45), now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.085);
    }

    pocket(isQueen = false, isFoul = false) {
      if (!this.enabled) return;
      this.init();
      if (!this.ctx) return;
      this.vibrate(isQueen ? [25, 30, 45] : 22);
      const now = this.ctx.currentTime;
      const notes = isFoul ? [210, 145] : (isQueen ? [523.25, 659.25, 783.99] : [440, 587.33]);
      notes.forEach((f, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = isFoul ? 'sawtooth' : 'triangle';
        osc.frequency.setValueAtTime(f, now + i * 0.055);
        gain.gain.setValueAtTime(0.22, now + i * 0.055);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.055 + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + i * 0.055);
        osc.stop(now + i * 0.055 + 0.16);
      });
    }

    tap() {
      if (!this.enabled) return;
      this.init();
      if (!this.ctx) return;
      this.vibrate(6);
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(660, now);
      gain.gain.setValueAtTime(0.06, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.022);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.025);
    }
  }

  const inkLineMat = new THREE.LineBasicMaterial({ color: 0x121216 });

  function addInkEdges(mesh, thresholdAngle = 22) {

  function addInvertedHull(mesh, scaleX = 1.04, scaleY = 1.06, scaleZ = 1.04) {

  function createStylizedFloorTexture() {
    const c = document.createElement('canvas');
    c.width = 1024;
    c.height = 1024;
    const ctx = c.getContext('2d');

    ctx.fillStyle = '#e0bd8c';
    ctx.fillRect(0, 0, 1024, 1024);

    const rows = 16;
    const cols = 4;
    const rowH = 1024 / rows;
    const colW = 1024 / cols;

    for (let r = 0; r < rows; r++) {
      const stagger = (r % 2) * (colW * 0.5);
      for (let col = -1; col <= cols; col++) {
        const x = col * colW + stagger;
        const y = r * rowH;
        const palette = ['#e4c394', '#d9b584', '#cfa976', '#e8ca9d'];
        ctx.fillStyle = palette[(r * 3 + col * 5 + 10) % palette.length];
        ctx.fillRect(x, y, colW, rowH);

        ctx.strokeStyle = 'rgba(30, 22, 16, 0.12)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x + 18, y + rowH * 0.5);
        ctx.lineTo(x + colW - 18, y + rowH * 0.5);
        ctx.stroke();

        ctx.strokeStyle = '#231c16';
        ctx.lineWidth = 3;
        ctx.strokeRect(x, y, colW, rowH);
      }
    }

    const rx = 180, ry = 180, rw = 664, rh = 664;

    ctx.fillStyle = 'rgba(18, 18, 22, 0.30)';
    ctx.fillRect(rx + 10, ry + 10, rw, rh);

    ctx.fillStyle = '#fff9eb';
    ctx.strokeStyle = '#121216';
    ctx.lineWidth = 2.5;
    for (let fx = rx + 8; fx < rx + rw - 8; fx += 14) {
      ctx.fillRect(fx, ry - 16, 8, 16);
      ctx.strokeRect(fx, ry - 16, 8, 16);
      ctx.fillRect(fx, ry + rh, 8, 16);
      ctx.strokeRect(fx, ry + rh, 8, 16);
    }

    ctx.fillStyle = '#ff5722';
    ctx.fillRect(rx, ry, rw, rh);
    ctx.lineWidth = 5;
    ctx.strokeRect(rx, ry, rw, rh);

    ctx.fillStyle = '#1d3557';
    ctx.fillRect(rx + 32, ry + 32, rw - 64, rh - 64);
    ctx.strokeRect(rx + 32, ry + 32, rw - 64, rh - 64);

    ctx.fillStyle = '#ffbe0b';
    ctx.fillRect(rx + 62, ry + 62, rw - 124, rh - 124);
    ctx.strokeRect(rx + 62, ry + 62, rw - 124, rh - 124);

    ctx.fillStyle = '#fff8eb';
    ctx.fillRect(rx + 88, ry + 88, rw - 176, rh - 176);
    ctx.strokeRect(rx + 88, ry + 88, rw - 176, rh - 176);

    ctx.fillStyle = '#00b4d8';
    ctx.beginPath();
    ctx.moveTo(512, ry + 120);
    ctx.lineTo(rx + rw - 120, 512);
    ctx.lineTo(512, ry + rh - 96);
    ctx.lineTo(rx + 120, 512);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = 'rgba(18, 18, 22, 0.26)';
    ctx.fillRect(344, 344, 348, 348);

    const tex = new THREE.CanvasTexture(c);
    tex.anisotropy = 4;
    tex.encoding = THREE.sRGBEncoding;
    return tex;
  }

  function distToSegmentSq(px, pz, ax, az, bx, bz) {
    const abx = bx - ax;
    const abz = bz - az;
    const apx = px - ax;
    const apz = pz - az;
    const lenSq = abx * abx + abz * abz;
    let t = lenSq > 1e-6 ? (apx * abx + apz * abz) / lenSq : 0;
    t = Math.max(0, Math.min(1, t));
    const cx = ax + t * abx - px;
    const cz = az + t * abz - pz;
    return cx * cx + cz * cz;
  }

  function distToRectSq(px, pz, minX, maxX, minZ, maxZ) {
    const dx = Math.max(0, minX - px, px - maxX);
    const dz = Math.max(0, minZ - pz, pz - maxZ);
    return dx * dx + dz * dz;
  }

    ctx.beginPath();

    ctx.save();

  class RigidDisc3D {
    constructor(id, type, radius, halfH, mass) {
      this.id = id;
      this.type = type;
      this.value = COIN_VALUES[type] || 0;
      this.radius = radius;
      this.halfH = halfH;
      this.mass = mass;
      this.invMass = 1.0 / mass;

      this.I_trans = (1.0 / 12.0) * mass * (3.0 * radius * radius + 4.0 * halfH * halfH);
      this.invI = 1.0 / this.I_trans;

      this.pos = new THREE.Vector3(0, halfH, 0);
      this.startShotPos = new THREE.Vector3(0, halfH, 0);
      this.vel = new THREE.Vector3();
      this.angVel = new THREE.Vector3();

      this.spinYaw = 0;

      this.pocketed = false;
      this.owner = 0;
      this.fallingPocket = null;
      this.fallTimer = 0;
      this.poised = false;
      this.movedThisShot = false;

      const geo = new THREE.CylinderGeometry(radius, radius, halfH * 2, 32);
      const sMat = new THREE.MeshStandardMaterial({ color: sideColors[type], roughness: 0.34, metalness: 0.04 });
      const cMat = new THREE.MeshStandardMaterial({ map: capTextures[type], roughness: 0.26, metalness: 0.04 });
      this.mesh = new THREE.Mesh(geo, [sMat, cMat, cMat]);
      this.mesh.castShadow = true;
      this.mesh.receiveShadow = true;

      addInvertedHull(this.mesh, 1.045, 1.08, 1.045);

      scene.add(this.mesh);
    }

    resetUpright(x, y, z, yaw = 0, poised = false) {
      this.pos.set(x, y, z);
      this.startShotPos.set(x, y, z);
      this.vel.set(0, 0, 0);
      this.angVel.set(0, 0, 0);
      this.u.set(0, 1, 0);
      this.spinYaw = yaw;
      this.pocketed = false;
      this.owner = 0;
      this.fallingPocket = null;
      this.fallTimer = 0;
      this.poised = poised;
      this.movedThisShot = false;
      this.syncMesh();
    }

    syncMesh() {
      this.mesh.position.copy(this.pos);
      if (_upVec.dot(this.u) < -0.9999) {
        this.mesh.quaternion.setFromAxisAngle(_xAxis, Math.PI);
      } else {
        this.mesh.quaternion.setFromUnitVectors(_upVec, this.u);
      }
      if (this.spinYaw !== 0) {
        _spinQ.setFromAxisAngle(this.u, this.spinYaw);
        this.mesh.quaternion.premultiply(_spinQ);
      }
      this.mesh.visible = !this.pocketed || this.fallingPocket !== null;
    }
  }

  function cylExtent(u, R, H, nx, ny, nz) {
    let un = u.x * nx + u.y * ny + u.z * nz;
    if (un > 1.0) un = 1.0;
    else if (un < -1.0) un = -1.0;
    return H * Math.abs(un) + R * Math.sqrt(Math.max(0.0, 1.0 - un * un));
  }

  const _satNormal = new THREE.Vector3();
  const _candAxes = Array.from({ length: 8 }, () => new THREE.Vector3());

  function testCylinderSAT(A, B) {
    const dx = B.pos.x - A.pos.x;
    const dy = B.pos.y - A.pos.y;
    const dz = B.pos.z - A.pos.z;
    const distSq = dx * dx + dy * dy + dz * dz;
    const maxBound = A.radius + A.halfH + B.radius + B.halfH;
    if (distSq >= maxBound * maxBound) return -1;

    const dist = Math.sqrt(distSq);
    let numAxes = 0;

    _candAxes[numAxes++].copy(A.u);
    _candAxes[numAxes++].copy(B.u);

    if (dist > 1e-5) {
      _candAxes[numAxes++].set(dx / dist, dy / dist, dz / dist);
    }

    const dotA = dx * A.u.x + dy * A.u.y + dz * A.u.z;
    const rxA = dx - dotA * A.u.x;
    const ryA = dy - dotA * A.u.y;
    const rzA = dz - dotA * A.u.z;
    const rLenA = Math.hypot(rxA, ryA, rzA);
    if (rLenA > 1e-5) {
      _candAxes[numAxes++].set(rxA / rLenA, ryA / rLenA, rzA / rLenA);
    }

    const dotB = dx * B.u.x + dy * B.u.y + dz * B.u.z;
    const rxB = dx - dotB * B.u.x;
    const ryB = dy - dotB * B.u.y;
    const rzB = dz - dotB * B.u.z;
    const rLenB = Math.hypot(rxB, ryB, rzB);
    if (rLenB > 1e-5) {
      _candAxes[numAxes++].set(rxB / rLenB, ryB / rLenB, rzB / rLenB);
    }

    if (rLenA > 1e-5) {
      const ux = rxA / rLenA, uy = ryA / rLenA, uz = rzA / rLenA;
      _candAxes[numAxes].set(A.u.x + ux, A.u.y + uy, A.u.z + uz).normalize();
      numAxes++;
      _candAxes[numAxes].set(A.u.x - ux, A.u.y - uy, A.u.z - uz).normalize();
      numAxes++;
    }

    let minPen = Infinity;
    for (let i = 0; i < numAxes; i++) {
      const ax = _candAxes[i];
      let nx = ax.x, ny = ax.y, nz = ax.z;
      let projD = dx * nx + dy * ny + dz * nz;
      if (projD < 0) {
        nx = -nx; ny = -ny; nz = -nz;
        projD = -projD;
      }
      const extA = cylExtent(A.u, A.radius, A.halfH, nx, ny, nz);
      const extB = cylExtent(B.u, B.radius, B.halfH, nx, ny, nz);
      const pen = (extA + extB) - projD;
      if (pen <= 0) return -1;
      if (pen < minPen) {
        minPen = pen;
        _satNormal.set(nx, ny, nz);
      }
    }
    return minPen;
  }

  const _contactPt = new THREE.Vector3();
  const _rA = new THREE.Vector3();
  const _rB = new THREE.Vector3();
  const _vA = new THREE.Vector3();
  const _vB = new THREE.Vector3();
  const _vRel = new THREE.Vector3();
  const _rnA = new THREE.Vector3();
  const _rnB = new THREE.Vector3();
  const _imp = new THREE.Vector3();
  const _tang = new THREE.Vector3();

  function computeContactPoint(A, B, nx, ny, nz) {
    const uaN = A.u.x * nx + A.u.y * ny + A.u.z * nz;
    const ubN = B.u.x * nx + B.u.y * ny + B.u.z * nz;

    if (Math.abs(uaN) > 0.84 && Math.abs(ubN) > 0.84) {
      const dx = B.pos.x - A.pos.x;
      const dy = B.pos.y - A.pos.y;
      const dz = B.pos.z - A.pos.z;
      const axial = dx * A.u.x + dy * A.u.y + dz * A.u.z;
      const rx = dx - axial * A.u.x;
      const ry = dy - axial * A.u.y;
      const rz = dz - axial * A.u.z;
      const rDist = Math.hypot(rx, ry, rz);
      const s = uaN >= 0 ? 1.0 : -1.0;

      if (rDist > 1e-5) {
        const pivotR = Math.min(A.radius * 0.88, rDist * 0.68);
        const invR = pivotR / rDist;
        _contactPt.set(
          A.pos.x + s * A.halfH * A.u.x + rx * invR,
          A.pos.y + s * A.halfH * A.u.y + ry * invR,
          A.pos.z + s * A.halfH * A.u.z + rz * invR
        );
      } else {
        _contactPt.set(
          0.5 * (A.pos.x + B.pos.x),
          0.5 * (A.pos.y + B.pos.y),
          0.5 * (A.pos.z + B.pos.z)
        );
      }
      return;
    }

    const sA = Math.abs(uaN) > 0.25 ? (uaN >= 0 ? A.halfH : -A.halfH) : 0;
    const rxA = nx - uaN * A.u.x;
    const ryA = ny - uaN * A.u.y;
    const rzA = nz - uaN * A.u.z;
    const rlA = Math.hypot(rxA, ryA, rzA);
    const scA = rlA > 1e-5 ? A.radius / rlA : 0;

    const pxA = A.pos.x + sA * A.u.x + rxA * scA;
    const pyA = A.pos.y + sA * A.u.y + ryA * scA;
    const pzA = A.pos.z + sA * A.u.z + rzA * scA;

    const sB = Math.abs(ubN) > 0.25 ? (-ubN >= 0 ? B.halfH : -B.halfH) : 0;
    const rxB = -nx + ubN * B.u.x;
    const ryB = -ny + ubN * B.u.y;
    const rzB = -nz + ubN * B.u.z;
    const rB = Math.hypot(rxB, ryB, rzB);
    const scB = rB > 1e-5 ? B.radius / rB : 0;

    const pxB = B.pos.x + sB * B.u.x + rxB * scB;
    const pyB = B.pos.y + sB * B.u.y + ryB * scB;
    const pzB = B.pos.z + sB * B.u.z + rzB * scB;

    _contactPt.set(0.5 * (pxA + pxB), 0.5 * (pyA + pyB), 0.5 * (pzA + pzB));
  }

  // =========================================================================
  // 7. TOWER STACKING & PUTTING MONEY ON THE MIDDLE OF THE BOARD
  // =========================================================================
  let towerOrder = [];

  function setupSingleTowerRack() {
    const whites = coins.filter(c => c.type === 'white');
    const blacks = coins.filter(c => c.type === 'black');
    const H2 = COIN_HALF_H * 2;

    towerOrder = [];
    for (let i = 0; i < 9; i++) {
      towerOrder.push(blacks[i]);
      towerOrder.push(whites[i]);
    }
    towerOrder.push(queenBody);

    towerOrder.forEach((c, idx) => {
      c.resetUpright(0, COIN_HALF_H + idx * H2, 0, idx * 0.38, true);
    });
  }

  function placeCoinsInMiddleOfBoard(coinList) {
    if (!coinList || coinList.length === 0) return;
    const H2 = COIN_HALF_H * 2;

    let baseH = COIN_HALF_H;
    let anyPoisedAtCenter = false;
    for (let i = 0; i < coins.length; i++) {
      const c = coins[i];
      if (!c.pocketed && !coinList.includes(c) && Math.hypot(c.pos.x, c.pos.z) < COIN_RADIUS * 2.1) {
        const topY = c.pos.y + H2;
        if (topY > baseH) baseH = topY;
        if (c.poised) anyPoisedAtCenter = true;
      }
    }

    const shouldPoise = anyPoisedAtCenter || coinList.length >= 2;
    coinList.forEach((c, idx) => {
      c.resetUpright(0, baseH + idx * H2, 0, idx * 0.42, shouldPoise);
      if (!towerOrder.includes(c)) towerOrder.push(c);
    });
  }

  // =========================================================================
  // 8. PLOT ECONOMY, DEBT REPAYMENT & EXACT CHANGE ENGINE
  // =========================================================================
  function getPlayerCoins(p) {
    return coins.filter(c => c.pocketed && c.owner === p);
  }

  function getPlayerCounts(p) {
    const list = getPlayerCoins(p);
    return {
      black: list.filter(c => c.type === 'black').length,
      white: list.filter(c => c.type === 'white').length,
      queen: list.filter(c => c.type === 'queen').length
    };
  }

  function getPlayerMoney(p) {
    return getPlayerCoins(p).reduce((sum, c) => sum + c.value, 0);
  }

  function getPlayerNetScore(p) {
    return getPlayerMoney(p) - state.debt[p];
  }

  function areAllPlotsBought() {
    return PLOTS.every(p => p.owner !== 0);
  }

  function getActivePlotTier() {
    for (let t = 0; t <= 2; t++) {
      if (PLOTS.some(p => p.tier === t && p.owner === 0)) return t;
    }
    return 2;
  }

  function getCurrentTierCost() {
    if (areAllPlotsBought()) return 0;
    const t = getActivePlotTier();
    return [50, 100, 150][t];
  }

  // Settles any negative score / foul debt using Player p's coins:
  // "whenever it's negative scoring any coins is placed on board centre until the debt is covered
  //  and if it's a 20 and debt is ten then 20 is placed and any random 10 from the board is given to the player."
  function settlePlayerDebt(p) {
    const toBoard = [];
    while (state.debt[p] > 0) {
      const pCoins = getPlayerCoins(p);
      if (pCoins.length === 0) break;

      const blacks = pCoins.filter(c => c.type === 'black');
      if (blacks.length > 0) {
        toBoard.push(blacks[0]);
        blacks[0].owner = 0;
        state.debt[p] -= 10;
        continue;
      }

      const whites = pCoins.filter(c => c.type === 'white');
      if (whites.length > 0) {
        const w = whites[0];
        w.owner = 0;
        toBoard.push(w);
        if (state.debt[p] >= 20) {
          state.debt[p] -= 20;
        } else {
          // debt is 10 and coin is 20 -> place 20 on board and give any random 10 from board to player p!
          state.debt[p] = 0;
          const boardBlacks = coins.filter(c => !c.pocketed && c.type === 'black' && !toBoard.includes(c));
          if (boardBlacks.length > 0) {
            const randIdx = Math.floor(Math.random() * boardBlacks.length);
            const givenTen = boardBlacks[randIdx];
            givenTen.pocketed = true;
            givenTen.owner = p;
            givenTen.poised = false;
            givenTen.fallingPocket = null;
            givenTen.syncMesh();
          } else {
            const oppBlacks = coins.filter(c => c.pocketed && c.owner === (3 - p) && c.type === 'black');
            if (oppBlacks.length > 0) {
              oppBlacks[0].owner = p;
            }
          }
        }
        continue;
      }

      const queens = pCoins.filter(c => c.type === 'queen');
      if (queens.length > 0) {
        const q = queens[0];
        q.owner = 0;
        toBoard.push(q);
        let changeDue = Math.max(0, 50 - state.debt[p]);
        state.debt[p] = 0;
        const giveFromPool = (pool) => {
          for (const c of pool) {
            if (changeDue >= c.value && !toBoard.includes(c)) {
              c.pocketed = true;
              c.owner = p;
              c.poised = false;
              c.fallingPocket = null;
              c.syncMesh();
              changeDue -= c.value;
            }
          }
        };
        const bWhites = coins.filter(c => !c.pocketed && c.type === 'white');
        const bBlacks = coins.filter(c => !c.pocketed && c.type === 'black');
        giveFromPool(bWhites);
        giveFromPool(bBlacks);
        if (changeDue > 0) {
          const oWhites = coins.filter(c => c.pocketed && c.owner === (3 - p) && c.type === 'white');
          const oBlacks = coins.filter(c => c.pocketed && c.owner === (3 - p) && c.type === 'black');
          giveFromPool(oWhites);
          giveFromPool(oBlacks);
        }
        continue;
      }
      break;
    }

    if (toBoard.length > 0) {
      placeCoinsInMiddleOfBoard(toBoard);
    }
  }

  function findExactSubsetCounts(counts, target) {
    for (let dq = counts.queen; dq >= 0; dq--) {
      for (let dw = counts.white; dw >= 0; dw--) {
        const rem = target - (50 * dq + 20 * dw);
        if (rem >= 0 && rem % 10 === 0) {
          const db = rem / 10;
          if (db <= counts.black) {
            return { queen: dq, white: dw, black: db };
          }
        }
      }
    }
    return null;
  }

  function swapCoinOwnership(coinA, coinBList) {
    const targetOwner = coinBList[0].owner;
    const origOwner = coinA.owner;

    if (targetOwner === 0) {
      const ref = coinBList[0];
      coinA.resetUpright(ref.pos.x, ref.pos.y, ref.pos.z, ref.spinYaw, ref.poised);
      for (let i = 0; i < coinBList.length; i++) {
        coinBList[i].pocketed = true;
        coinBList[i].owner = origOwner;
        coinBList[i].fallingPocket = null;
        coinBList[i].poised = false;
        coinBList[i].syncMesh();
      }
    } else {
      coinA.owner = targetOwner;
      for (let i = 0; i < coinBList.length; i++) {
        coinBList[i].owner = origOwner;
      }
    }
  }

  function ensureExactChangeForPlayer(p, target) {
    let counts = getPlayerCounts(p);
    let sub = findExactSubsetCounts(counts, target);
    if (sub) return sub;

    const other = p === 1 ? 2 : 1;

    const pWhites = coins.filter(c => c.pocketed && c.owner === p && c.type === 'white');
    if (pWhites.length > 0) {
      const oppBlacks = coins.filter(c => c.pocketed && c.owner === other && c.type === 'black');
      if (oppBlacks.length >= 2) {
        swapCoinOwnership(pWhites[0], [oppBlacks[0], oppBlacks[1]]);
      } else {
        const boardBlacks = coins.filter(c => !c.pocketed && c.type === 'black');
        if (boardBlacks.length >= 2) {
          swapCoinOwnership(pWhites[0], [boardBlacks[0], boardBlacks[1]]);
        }
      }
    }

    counts = getPlayerCounts(p);
    sub = findExactSubsetCounts(counts, target);
    if (sub) return sub;

    const pQueens = coins.filter(c => c.pocketed && c.owner === p && c.type === 'queen');
    if (pQueens.length > 0) {
      const oppCounts = getPlayerCounts(other);
      const oppSub50 = findExactSubsetCounts({ queen: 0, white: oppCounts.white, black: oppCounts.black }, 50);
      if (oppSub50) {
        const oppW = coins.filter(c => c.pocketed && c.owner === other && c.type === 'white').slice(0, oppSub50.white);
        const oppB = coins.filter(c => c.pocketed && c.owner === other && c.type === 'black').slice(0, oppSub50.black);
        swapCoinOwnership(pQueens[0], [...oppW, ...oppB]);
      }
    }

    counts = getPlayerCounts(p);
    return findExactSubsetCounts(counts, target);
  }

  function transferPlayerCoinsToBoard(p, subsetCounts) {
    const pBlacks = coins.filter(c => c.pocketed && c.owner === p && c.type === 'black').slice(0, subsetCounts.black);
    const pWhites = coins.filter(c => c.pocketed && c.owner === p && c.type === 'white').slice(0, subsetCounts.white);
    const pQueens = coins.filter(c => c.pocketed && c.owner === p && c.type === 'queen').slice(0, subsetCounts.queen);
    const toPlace = [...pBlacks, ...pWhites, ...pQueens];
    placeCoinsInMiddleOfBoard(toPlace);
  }

  function transferCoinsPlayerToPlayer(fromP, toP, amount) {
    if (amount <= 0) return;
    const sub = ensureExactChangeForPlayer(fromP, amount);
    if (!sub) return;
    const fBlacks = coins.filter(c => c.pocketed && c.owner === fromP && c.type === 'black').slice(0, sub.black);
    const fWhites = coins.filter(c => c.pocketed && c.owner === fromP && c.type === 'white').slice(0, sub.white);
    const fQueens = coins.filter(c => c.pocketed && c.owner === fromP && c.type === 'queen').slice(0, sub.queen);
    [...fBlacks, ...fWhites, ...fQueens].forEach(c => { c.owner = toP; });
  }

    const tierPlots = PLOTS.filter(p => p.tier === tier);

    tierPlots.forEach((p) => {
      const btn = document.createElement('button');

        statusText = 'OWNED BY P1';
      } else if (p.owner === 2) {
        cls += ' owned-p2';

      } else if (state.selectedPlotId === p.id) {
        cls += ' selected';
        statusText = `SELECTED (${p.cost})`;
      }
      btn.className = cls;
      btn.innerHTML = `<span class="plot-card-name">${p.name}</span><span class="plot-card-status">${statusText}</span>`;
      if (p.owner === 0) {
        btn.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          sfx.tap();
          state.selectedPlotId = p.id;
          renderBuyModal();
        });
      }
      grid.appendChild(btn);
    });

    const counts = getPlayerCounts(buyer);
    document.getElementById('own-b-lbl').textContent = `[HAVE ${counts.black}]`;
    document.getElementById('own-w-lbl').textContent = `[HAVE ${counts.white}]`;
    document.getElementById('own-q-lbl').textContent = `[HAVE ${counts.queen}]`;

    document.getElementById('pay-b-val').textContent = state.paySelect.black;
    document.getElementById('pay-w-val').textContent = state.paySelect.white;
    document.getElementById('pay-q-val').textContent = state.paySelect.queen;

    const selectedSum = state.paySelect.black * 10 + state.paySelect.white * 20 + state.paySelect.queen * 50;
    document.getElementById('pay-sum-label').textContent = `${selectedSum} / ${cost}`;

    const confirmBtn = document.getElementById('btn-confirm-buy');
    confirmBtn.disabled = !(state.selectedPlotId && selectedSum === cost);
  }

  function adjustPayCount(type, delta) {
    const buyer = state.buyModalBuyer;
    const counts = getPlayerCounts(buyer);
    const next = state.paySelect[type] + delta;
    if (next < 0 || next > counts[type]) return;
    sfx.tap();
    state.paySelect[type] = next;
    renderBuyModal();
  }

  document.getElementById('pay-b-minus').addEventListener('pointerdown', (e) => { e.preventDefault(); adjustPayCount('black', -1); });
  document.getElementById('pay-b-plus').addEventListener('pointerdown', (e) => { e.preventDefault(); adjustPayCount('black', 1); });
  document.getElementById('pay-w-minus').addEventListener('pointerdown', (e) => { e.preventDefault(); adjustPayCount('white', -1); });
  document.getElementById('pay-w-plus').addEventListener('pointerdown', (e) => { e.preventDefault(); adjustPayCount('white', 1); });
  document.getElementById('pay-q-minus').addEventListener('pointerdown', (e) => { e.preventDefault(); adjustPayCount('queen', -1); });
  document.getElementById('pay-q-plus').addEventListener('pointerdown', (e) => { e.preventDefault(); adjustPayCount('queen', 1); });

  document.getElementById('btn-open-buy').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (state.phase !== 'IDLE' || !state.canBuyThisTurn || areAllPlotsBought()) return;

    const buyer = (state.gameMode === '2P' && state.turn === 2) ? 2 : 1;
    openBuyModal(buyer, false);
  });

    e.preventDefault();

    sfx.tap();

  // Note: "Whenever a player buys a plot any piece already on it is NOT given to the player

  document.getElementById('btn-confirm-buy').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    const plot = PLOTS.find(p => p.id === state.selectedPlotId);
    if (!plot || plot.owner !== 0) return;

    const buyer = state.buyModalBuyer;
    const selectedSum = state.paySelect.black * 10 + state.paySelect.white * 20 + state.paySelect.queen * 50;
    if (selectedSum !== plot.cost) return;

    sfx.pocket(true, false);
    plot.owner = buyer;
    syncPlotVisuals();

    transferPlayerCoinsToBoard(buyer, state.paySelect);

    buyBackdrop.classList.remove('open');
    state.buyForced = false;
    updateUI();

    const buyerName = buyer === 1 ? 'P1' : (state.gameMode === '2P' ? 'P2' : 'AI');
    showToast(`${buyerName} BOUGHT ${plot.name}!`);
    placeStrikerOnBaseline();

    if (state.phase === 'FORCED_BUY') {
      if (state.turn === 2 && state.gameMode === 'AI') {
        runAITurn();
      } else {
        state.phase = 'IDLE';
        updateUI();
      }
    }

  function executeAIBuyIfPossible(isForced = false) {
    if (areAllPlotsBought()) return false;
    const tier = getActivePlotTier();
    const cost = [50, 100, 150][tier];
    if (getPlayerNetScore(2) < cost) return false;

    const availPlots = PLOTS.filter(p => p.tier === tier && p.owner === 0);
    if (availPlots.length === 0) return false;

    const sub = ensureExactChangeForPlayer(2, cost);
    if (!sub) return false;

    const chosenPlot = availPlots[Math.floor(Math.random() * availPlots.length)];
    chosenPlot.owner = 2;
    syncPlotVisuals();
    transferPlayerCoinsToBoard(2, sub);
    sfx.pocket(true, false);
    updateUI();

    showToast(isForced ? `AI FORCED BUY: ${chosenPlot.name}!` : `AI BOUGHT ${chosenPlot.name}!`);
    return true;
  }

    state.sellModalPlayer = bankruptPlayer;
    const ownedPlots = PLOTS.filter(p => p.owner === bankruptPlayer);
    if (ownedPlots.length === 0) {
      declareWinner(3 - bankruptPlayer, 'OPPONENT BANKRUPT & NO PLOTS LEFT!');

    state.selectedSellPlotId = ownedPlots[0].id;

  function executePlotSaleAndEqualStake(bankruptPlayer, plot) {
    const richPlayer = 3 - bankruptPlayer;
    // 1. Plot is sold to the other player
    plot.owner = richPlayer;
    syncPlotVisuals();

    // 2. Bankrupt player gets the exact amount of money (plot.cost) from the other player
    transferCoinsPlayerToPlayer(richPlayer, bankruptPlayer, plot.cost);

    // Clear any foul debt if applicable
    if (state.debt[bankruptPlayer] > 0) {
      settlePlayerDebt(bankruptPlayer);
    }

    // 3. Both players place equal amount of money (whoever has the least) on the middle of the board!
    const m1 = getPlayerMoney(1);
    const m2 = getPlayerMoney(2);
    const stake = Math.min(m1, m2);
    if (stake > 0) {
      const sub1 = ensureExactChangeForPlayer(1, stake);
      if (sub1) transferPlayerCoinsToBoard(1, sub1);
      const sub2 = ensureExactChangeForPlayer(2, stake);
      if (sub2) transferPlayerCoinsToBoard(2, sub2);
    }

    sfx.pocket(true, false);
    updateUI();
    const sName = bankruptPlayer === 1 ? 'P1' : (state.gameMode === '2P' ? 'P2' : 'AI');
    showToast(`${sName} SOLD ${plot.name} (${plot.cost}) // EACH STAKES ${stake}!`, 2600);
  }

    const plot = PLOTS.find(pl => pl.id === state.selectedSellPlotId && pl.owner === p);
    if (!plot) return;

    sellBackdrop.classList.remove('open');
