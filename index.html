  // =========================================================================
  // 12. STRIKER PLACEMENT, AIMING & SHOT EXECUTION
  // =========================================================================
  function isBaselineSpotClear(xWorld, zWorld) {
    const minDist = STRIKER_RADIUS + COIN_RADIUS + 0.06;
    for (let i = 0; i < coins.length; i++) {
      const c = coins[i];
      if (c.pocketed) continue;
      if (c.pos.y > COIN_RADIUS * 1.6) continue;
      const dx = c.pos.x - xWorld;
      const dz = c.pos.z - zWorld;
      if (dx * dx + dz * dz < minDist * minDist) return false;
    }
    return true;
  }

  function placeStrikerOnBaseline() {
    const zLine = state.turn === 1 ? BASELINE_Z : -BASELINE_Z;
    const xDir = state.turn === 1 ? 1 : -1;
    let targetX = state.strikerX * BASELINE_SPAN * xDir;

    let clear = isBaselineSpotClear(targetX, zLine);
    if (!clear) {
      for (let s = 1; s <= 32; s++) {
        const off = s * 0.34;
        if (Math.abs(targetX + off) <= BASELINE_SPAN && isBaselineSpotClear(targetX + off, zLine)) {
          targetX += off;
          clear = true;
          break;
        }
        if (Math.abs(targetX - off) <= BASELINE_SPAN && isBaselineSpotClear(targetX - off, zLine)) {
          targetX -= off;
          clear = true;
          break;
        }
      }
    }

    striker.resetUpright(targetX, STRIKER_HALF_H, zLine, 0, false);

    const dx = -striker.pos.x;
    const dz = -striker.pos.z;
    const len = Math.hypot(dx, dz) || 1;
    state.aimDirX = dx / len;
    state.aimDirZ = dz / len;

    const track = document.getElementById('slider-track');
    const thumb = document.getElementById('slider-thumb');
    const norm = (state.strikerX + 1) * 0.5;
    const trackW = Math.max(60, track.clientWidth - 40);
    thumb.style.left = `${20 + norm * trackW}px`;
    thumb.classList.toggle('blocked', !clear);

    updateAimGuide();
  }

  function getPowerColorHex(pwr) {
    if (pwr < 0.40) return 0x00e5ff;
    if (pwr < 0.72) return 0xffbe0b;
    return 0xff1744;
  }

  function updateAimGuide(animatePulse = 0) {
    const show = state.phase === 'IDLE' && state.inputMode === 'STRIKE' && (state.turn === 1 || state.gameMode === '2P');
    aimGroup.visible = show;
    if (!show) return;

    const sx = striker.pos.x;
    const sz = striker.pos.z;
    const dirX = state.aimDirX;
    const dirZ = state.aimDirZ;

    if (state.shotCancelled) {
      pwrInnerRing.position.set(sx, 0.03, sz);
      pwrInnerRing.scale.set(0.75, 0.75, 1);
      pwrInnerMat.color.setHex(0x71717a);
      pwrOuterRing.visible = false;
      pullBandLine.visible = false;
      pullHandle.visible = false;
      ghostRing.visible = false;
      deflectLine.visible = false;
      dashMeshes.forEach(d => { d.visible = false; });
      return;
    }

    const pwr = state.aimPower;
    const colHex = getPowerColorHex(pwr);
    const pulse = 1.0 + Math.sin(animatePulse * 14.0) * (pwr * 0.06);

    pwrInnerRing.position.set(sx, 0.03, sz);
    const scInner = (0.85 + pwr * 0.75) * pulse;
    pwrInnerRing.scale.set(scInner, scInner, 1);
    pwrInnerMat.color.setHex(colHex);

    pwrOuterRing.visible = true;
    pwrOuterRing.position.set(sx, 0.025, sz);
    const scOuter = (0.90 + pwr * 0.95) / pulse;
    pwrOuterRing.scale.set(scOuter, scOuter, 1);

    const pullLen = Math.min(3.6, Math.max(0.6, state.pullDist));
    const hx = sx - dirX * pullLen;
    const hz = sz - dirZ * pullLen;

    pullBandLine.visible = true;
    const bArr = pullBandGeo.attributes.position.array;
    bArr[0] = sx; bArr[1] = 0.15; bArr[2] = sz;
    bArr[3] = hx; bArr[4] = 0.15; bArr[5] = hz;
    pullBandGeo.attributes.position.needsUpdate = true;

    pullHandle.visible = true;
    pullHandle.position.set(hx, 0.15, hz);
    pullHandle.rotation.y = Math.atan2(dirX, dirZ);
    pullHandleMat.color.setHex(colHex);

    let bestT = 18.0;
    let hitCoin = null;
    const sumR = STRIKER_RADIUS + COIN_RADIUS;

    for (let i = 0; i < coins.length; i++) {
      const c = coins[i];
      if (c.pocketed || c.pos.y > COIN_RADIUS * 1.5) continue;
      const ocx = c.pos.x - sx;
      const ocz = c.pos.z - sz;
      const proj = ocx * dirX + ocz * dirZ;
      if (proj <= 0) continue;
      const perpSq = (ocx * ocx + ocz * ocz) - proj * proj;
      if (perpSq < sumR * sumR) {
        const t = proj - Math.sqrt(sumR * sumR - perpSq);
        if (t > 0 && t < bestT) {
          bestT = t;
          hitCoin = c;
        }
      }
    }

    const wallX = dirX > 1e-4 ? (BOARD_HALF - STRIKER_RADIUS - sx) / dirX
      : (dirX < -1e-4 ? (-BOARD_HALF + STRIKER_RADIUS - sx) / dirX : 99);
    const wallZ = dirZ > 1e-4 ? (BOARD_HALF - STRIKER_RADIUS - sz) / dirZ
      : (dirZ < -1e-4 ? (-BOARD_HALF + STRIKER_RADIUS - sz) / dirZ : 99);
    const wallT = Math.min(wallX, wallZ);
    if (wallT < bestT) {
      bestT = Math.max(0.2, wallT);
      hitCoin = null;
    }

    const gx = sx + dirX * bestT;
    const gz = sz + dirZ * bestT;

    const yaw = Math.atan2(dirX, dirZ);
    const marchOffset = (animatePulse * 2.2) % 1.0;
    for (let i = 0; i < NUM_DASHES; i++) {
      const dm = dashMeshes[i];
      const frac = (i + marchOffset) / NUM_DASHES;
      const dist = frac * bestT;
      if (dist < STRIKER_RADIUS * 1.2 || dist > bestT - STRIKER_RADIUS * 0.6) {
        dm.visible = false;
      } else {
        dm.visible = true;
        dm.position.set(sx + dirX * dist, 0.08, sz + dirZ * dist);
        dm.rotation.y = yaw;
        dm.material.color.setHex(i % 2 === 0 ? colHex : 0x121216);
      }
    }

    ghostRing.visible = true;
    ghostRing.position.set(gx, 0.035, gz);
    ghostMat.color.setHex(colHex);

    if (hitCoin) {
      deflectLine.visible = true;
      const nx = (hitCoin.pos.x - gx) / sumR;
      const nz = (hitCoin.pos.z - gz) / sumR;
      const dArr = deflectGeo.attributes.position.array;
      dArr[0] = hitCoin.pos.x;
      dArr[1] = 0.16;
      dArr[2] = hitCoin.pos.z;
      dArr[3] = hitCoin.pos.x + nx * (4.2 * pwr);
      dArr[4] = 0.16;
      dArr[5] = hitCoin.pos.z + nz * (4.2 * pwr);
      deflectGeo.attributes.position.needsUpdate = true;
    } else {
      deflectLine.visible = false;
    }
  }

  function updatePowerHUD() {
    const lbl = document.getElementById('power-label');
    const val = document.getElementById('power-val');
    const fill = document.getElementById('power-fill');

    if (state.shotCancelled) {
      lbl.textContent = 'NEAR STRIKER';
      val.textContent = 'CANCEL';
      fill.style.width = '0%';
      fill.style.backgroundColor = '#71717a';
      return;
    }

    const pct = Math.round(state.aimPower * 100);
    lbl.textContent = 'STRIKE POWER';
    val.textContent = `${pct}%`;
    fill.style.width = `${Math.min(100, (state.aimPower / MAX_POWER_PCT) * 100)}%`;

    if (state.aimPower < 0.40) fill.style.backgroundColor = '#00e5ff';
    else if (state.aimPower < 0.72) fill.style.backgroundColor = '#ffb700';
    else fill.style.backgroundColor = '#ff1744';
  }

  function launchStriker() {
    if (state.phase !== 'IDLE' && state.phase !== 'AI_TURN') return;
    sfx.init();
    sfx.clack(1.0, 0.82);
    sfx.vibrate(22);

    // "Players can only buy at the start of the turn, using the striker ends the right to buy even if it results in a coin covered."
    state.canBuyThisTurn = false;

    // Record start-of-shot positions for all board pieces so only pieces that MOVE and END UP on a plot are captured!
    for (let i = 0; i < coins.length; i++) {
      const c = coins[i];
      c.startShotPos.copy(c.pos);
      c.movedThisShot = false;
    }

    const normPwr = state.aimPower / MAX_POWER_PCT;
    const speed = 24.0 + normPwr * 78.0;
    striker.vel.set(state.aimDirX * speed, 0, state.aimDirZ * speed);
    striker.angVel.set(0, 0, 0);

    state.pocketedEvents = [];
    state.shotElapsed = 0;
    state.settleFrames = 0;
    state.phase = 'SIMULATING';
    document.getElementById('power-hud').classList.remove('visible');
    setInputMode('VIEW');
    aimGroup.visible = false;
    updateUI();
  }

  function runAITurn() {
    clearTimeout(state.aiTimer);
    state.phase = 'AI_TURN';
    updateUI();

    state.aiTimer = setTimeout(() => {
      if (state.phase !== 'AI_TURN') return;

      // AI can only buy at the start of its turn (`state.canBuyThisTurn === true`)
      if (state.canBuyThisTurn && !areAllPlotsBought()) {
        const tierCost = getCurrentTierCost();
        if (getPlayerNetScore(2) >= tierCost) {
          executeAIBuyIfPossible(false);
        }
      }

      const poisedCoins = coins.filter(c => !c.pocketed && c.poised);
      const targets = poisedCoins.length > 0
        ? [poisedCoins[0]]
        : coins.filter(c => !c.pocketed);

      state.strikerX = (Math.random() - 0.5) * 0.45;
      placeStrikerOnBaseline();

      if (targets.length > 0) {
        targets.sort((a, b) => b.value - a.value);
        const target = targets[0];
        const dx = target.pos.x - striker.pos.x + (Math.random() - 0.5) * 0.10;
        const dz = target.pos.z - striker.pos.z;
        const len = Math.hypot(dx, dz) || 1;
        state.aimDirX = dx / len;
        state.aimDirZ = dz / len;
        state.aimPower = poisedCoins.length > 0 ? MAX_POWER_PCT : Math.min(MAX_POWER_PCT, 0.62 + Math.random() * 0.26);
      } else {
        state.aimDirX = 0;
        state.aimDirZ = 1;
        state.aimPower = 0.75;
      }

      state.aiTimer = setTimeout(() => {
        if (state.phase === 'AI_TURN') {
          launchStriker();
        }
      }, 380);
    }, 520);
  }

  // =========================================================================
  // 13. QUEEN COVER, FOUL DEBT, MOVED-PIECE PLOT CAPTURE & ENDGAME BANKRUPTCY
  // =========================================================================
  function evaluatePlotCapturesAndTurn() {
    const shooter = state.turn;
    const opp = shooter === 1 ? 2 : 1;
    const wasPendingQueen = (state.pendingQueenFor === shooter);

    let foulCount = 0;
    let queenHoledUnbought = false;
    let shooterNonQueenHoledCount = 0;
    let shooterPlotCapturedCount = 0;
    const coinsToReturnCenter = [];

    // 1. Evaluate pieces pocketed into Holes during the shot
    const holePlots = PLOTS.filter(p => p.tier === 2);
    for (let i = 0; i < state.pocketedEvents.length; i++) {
      const ev = state.pocketedEvents[i];
      if (ev.coin.type === 'striker') {
        foulCount++;
        continue;
      }

      const holePlot = holePlots.find(hp => hp.pocketIdx === ev.pocketIdx);
      const holeOwner = holePlot ? holePlot.owner : 0;

      if (ev.coin.type === 'queen') {
        if (holeOwner !== 0) {
          // "if buyer holes any piece be it queen too in their plot or hole then it goes to them"
          ev.coin.owner = holeOwner;
          if (holeOwner === shooter) shooterNonQueenHoledCount++;
        } else {
          // Unbought hole -> Queen requires covering with a coin in a hole!
          queenHoledUnbought = true;
        }
      } else {
        const recipient = holeOwner !== 0 ? holeOwner : shooter;
        ev.coin.owner = recipient;
        if (recipient === shooter) {
          shooterNonQueenHoledCount++;
        }
      }
    }

    // 2. Check all remaining un-pocketed pieces on the board that MOVED this shot and ENDED UP on a bought Line or Rectangle:
    // "Whenever a player buys a plot any piece already on it is NOT given to the player
    //  only those piece that MOVES and then END UP on the plot is given to the player."
    const boughtLines = PLOTS.filter(p => p.tier === 0 && p.owner !== 0);
    const boughtRects = PLOTS.filter(p => p.tier === 1 && p.owner !== 0);

    if (boughtLines.length > 0 || boughtRects.length > 0) {
      const touchLineRadSq = (COIN_RADIUS + 0.14) * (COIN_RADIUS + 0.14);
      const touchRectRadSq = (COIN_RADIUS + 0.05) * (COIN_RADIUS + 0.05);

      for (let i = 0; i < coins.length; i++) {
        const c = coins[i];
        if (c.pocketed || c.poised) continue;

        // Must have actually moved during this shot!
        const movedDist = Math.hypot(c.pos.x - c.startShotPos.x, c.pos.z - c.startShotPos.z);
        if (!c.movedThisShot && movedDist < 0.06) continue;

        let touchedP1 = false;
        let touchedP2 = false;

        for (let l = 0; l < boughtLines.length; l++) {
          const lp = boughtLines[l];
          const dSq = distToSegmentSq(c.pos.x, c.pos.z, lp.sx * 3.03, lp.sz * 3.03, lp.sx * 7.26, lp.sz * 7.26);
          if (dSq <= touchLineRadSq) {
            if (lp.owner === 1) touchedP1 = true;
            if (lp.owner === 2) touchedP2 = true;
          }
        }

        for (let r = 0; r < boughtRects.length; r++) {
          const rp = boughtRects[r];
          const dSq = distToRectSq(c.pos.x, c.pos.z, rp.minX, rp.maxX, rp.minZ, rp.maxZ);
          if (dSq <= touchRectRadSq) {
            if (rp.owner === 1) touchedP1 = true;
            if (rp.owner === 2) touchedP2 = true;
          }
        }

        // If simultaneously on both players' bought areas -> goes to no one!
        if (touchedP1 && !touchedP2) {
          c.pocketed = true;
          c.owner = 1;
          c.fallingPocket = null;
          c.syncMesh();
          if (shooter === 1) shooterPlotCapturedCount++;
        } else if (touchedP2 && !touchedP1) {
          c.pocketed = true;
          c.owner = 2;
          c.fallingPocket = null;
          c.syncMesh();
          if (shooter === 2) shooterPlotCapturedCount++;
        }
      }
    }

    // 3. Evaluate Queen Cover Rules & Foul Rules:
    let keepTurn = false;
    let nextPendingQueenFor = 0;

    if (foulCount > 0) {
      state.debt[shooter] += foulCount * 10;

      if (queenHoledUnbought || wasPendingQueen) {
        queenBody.owner = 0;
        coinsToReturnCenter.push(queenBody);
        showToast('FOUL WITH QUEEN // QUEEN & PENALTY ON BOARD!');
      } else {
        showToast(`STRIKER FOUL (-${foulCount * 10})!`);
      }
      keepTurn = false;
      nextPendingQueenFor = 0;

    } else if (wasPendingQueen) {
      if (shooterNonQueenHoledCount > 0 && shooterPlotCapturedCount === 0) {
        queenBody.owner = shooter;
        keepTurn = true;
        showToast('QUEEN COVERED (+50)!');
      } else {
        queenBody.owner = 0;
        coinsToReturnCenter.push(queenBody);
        keepTurn = false;
        showToast('QUEEN NOT COVERED // PLACED IN MIDDLE');
      }
      nextPendingQueenFor = 0;

    } else if (queenHoledUnbought) {
      if (shooterPlotCapturedCount > 0) {
        // "A queen is not covered by holing the queen and getting a piece on the plot
        //  in that case the plot piece is acquired and queen is placed in the middle and end turn."
        queenBody.owner = 0;
        coinsToReturnCenter.push(queenBody);
        keepTurn = false;
        nextPendingQueenFor = 0;
        showToast('PLOT PIECE ACQUIRED // QUEEN TO MIDDLE & TURN ENDS');
      } else if (shooterNonQueenHoledCount > 0) {
        queenBody.owner = shooter;
        keepTurn = true;
        nextPendingQueenFor = 0;
        showToast('QUEEN & COVER HOLED (+50)!');
      } else {
        const otherCoinsOnBoard = coins.filter(c => !c.pocketed && c.type !== 'queen').length;
        if (otherCoinsOnBoard > 0) {
          keepTurn = true;
          nextPendingQueenFor = shooter;
          showToast('QUEEN HOLED // COVER IN HOLE NEXT SHOT!');
        } else {
          queenBody.owner = 0;
          coinsToReturnCenter.push(queenBody);
          keepTurn = false;
          nextPendingQueenFor = 0;
          showToast('NO COINS LEFT TO COVER QUEEN // RETURNED');
        }
      }
    } else {
      // "Whenever a player scores a coin by moving the piece to plot their turn ENDS.
      //  only when the final piece by a player is scored in hole only then player gets another strike chance
      //  and if it results like hole then on plot then turn ends."
      if (shooterPlotCapturedCount > 0) {
        keepTurn = false;
        showToast('PLOT CAPTURED // TURN ENDS');
      } else if (shooterNonQueenHoledCount > 0) {
        keepTurn = true;
        showToast('HOLED // EXTRA STRIKE');
      } else {
        keepTurn = false;
      }
    }

    state.pendingQueenFor = nextPendingQueenFor;

    if (coinsToReturnCenter.length > 0) {
      placeCoinsInMiddleOfBoard(coinsToReturnCenter);
    }

    // 4. Settle any negative score / foul debt for both players immediately:
    if (state.debt[1] > 0) settlePlayerDebt(1);
    if (state.debt[2] > 0) settlePlayerDebt(2);

    updateUI();

    // 5. Advance Turn if keepTurn is false
    if (state.gameMode === 'FREE') {
      state.turn = 1;
      state.canBuyThisTurn = true;
    } else if (!keepTurn) {
      state.turn = opp;
      state.canBuyThisTurn = true; // Start of new turn -> right to buy unlocked!
    } else {
      // Continuing turn after holing -> using the striker already ended the right to buy for this turn!
      state.canBuyThisTurn = false;
    }

    // 6. Check Empty-Board Rules!
    const remainingOnBoard = coins.filter(c => !c.pocketed).length;
    if (remainingOnBoard === 0) {
      if (!areAllPlotsBought()) {
        const cost = getCurrentTierCost();
        const s1 = getPlayerNetScore(1);
        const s2 = getPlayerNetScore(2);

        if (s1 >= cost || s2 >= cost) {
          let forcedBuyer = 1;
          if (state.turn === 1 && s1 >= cost) forcedBuyer = 1;
          else if (state.turn === 2 && s2 >= cost) forcedBuyer = 2;
          else if (s1 >= cost) forcedBuyer = 1;
          else forcedBuyer = 2;

          if (forcedBuyer === 2 && state.gameMode === 'AI') {
            executeAIBuyIfPossible(true);
          } else {
            state.phase = 'FORCED_BUY';
            placeStrikerOnBaseline();
            openBuyModal(forcedBuyer, true);
            return;
          }
        } else {
          const m1 = getPlayerMoney(1);
          const m2 = getPlayerMoney(2);
          const leastNeed = Math.min(cost - m1, cost - m2);
          const contrib1 = Math.min(m1, Math.max(10, leastNeed));
          const contrib2 = Math.min(m2, Math.max(10, leastNeed));

          if (contrib1 > 0) {
            const sub1 = ensureExactChangeForPlayer(1, contrib1);
            if (sub1) transferPlayerCoinsToBoard(1, sub1);
          }
          if (contrib2 > 0) {
            const sub2 = ensureExactChangeForPlayer(2, contrib2);
            if (sub2) transferPlayerCoinsToBoard(2, sub2);
          }
          showToast(`BOTH SHORT! EACH PUTS ${leastNeed} ON BOARD`, 2400);
          updateUI();
        }
      } else {
        // Phase B: ALL 12 PLOTS UP TO HOLES ARE BOUGHT & ALL COINS ARE EMPTIED FROM THE BOARD!
        const m1 = getPlayerMoney(1);
        const m2 = getPlayerMoney(2);

        if (m1 > 0 && m2 > 0) {
          const equalStake = Math.min(m1, m2);
          const sub1 = ensureExactChangeForPlayer(1, equalStake);
          if (sub1) transferPlayerCoinsToBoard(1, sub1);
          const sub2 = ensureExactChangeForPlayer(2, equalStake);
          if (sub2) transferPlayerCoinsToBoard(2, sub2);
          showToast(`ALL PLOTS SOLD // BOTH STAKE ${equalStake} ON BOARD!`, 2600);
          updateUI();
        } else {
          const bankruptPlayer = m1 === 0 ? 1 : 2;
          const ownedByBankrupt = PLOTS.filter(p => p.owner === bankruptPlayer);

          if (ownedByBankrupt.length === 0) {
            declareWinner(3 - bankruptPlayer, 'ALL PLOTS & MONEY WON!');
            return;
          }

          if (bankruptPlayer === 2 && state.gameMode === 'AI') {
            ownedByBankrupt.sort((a, b) => a.cost - b.cost);
            executePlotSaleAndEqualStake(2, ownedByBankrupt[0]);
          } else {
            state.phase = 'BANKRUPT_SELL';
            placeStrikerOnBaseline();
            openBankruptSellModal(bankruptPlayer);
            return;
          }
        }
      }
    }

    placeStrikerOnBaseline();

    if (state.turn === 2 && state.gameMode === 'AI') {
      runAITurn();
    } else {
      state.phase = 'IDLE';
      updateUI();
    }
  }

  // =========================================================================
  // 14. 12-SUBSTEP HIGH-VELOCITY 3D PHYSICS STEPPER
  // =========================================================================
  const _rotAxis = new THREE.Vector3();
  const _rightAxis = new THREE.Vector3();

  function wakeTowerWithBucklingWave(impactBody) {
    const speed = impactBody.vel.length();
    const dirX = speed > 1e-3 ? impactBody.vel.x / speed : 0;
    const dirZ = speed > 1e-3 ? impactBody.vel.z / speed : -1;
    const perpX = -dirZ;
    const perpZ = dirX;

    const poisedList = coins.filter(c => !c.pocketed && c.poised);
    const n = poisedList.length;
    for (let idx = 0; idx < n; idx++) {
      const c = poisedList[idx];
      c.poised = false;
      c.movedThisShot = true;

      const hNorm = idx / Math.max(1, n - 1);
      const arch = Math.sin(hNorm * Math.PI);
      const forwardWhip = speed * 0.20 * arch;
      const lateralScatter = speed * 0.09 * Math.cos(idx * 0.75);

      c.vel.x += dirX * forwardWhip + perpX * lateralScatter;
      c.vel.z += dirZ * forwardWhip + perpZ * lateralScatter;
      c.angVel.x += perpX * (15.0 * (0.5 - hNorm));
      c.angVel.z += perpZ * (15.0 * (0.5 - hNorm));
    }
  }

  function stepPhysics(dtFrame) {
    if (state.phase !== 'SIMULATING') return;

    state.shotElapsed += dtFrame;
    const dampBoost = 1.0 + Math.max(0.0, (state.shotElapsed - 1.8) * 4.5);

    const SUBSTEPS = 12;
    const dt = Math.min(dtFrame, 0.025) / SUBSTEPS;
    const gravity = -42.0;
    let soundBudget = 3;

    for (let s = 0; s < SUBSTEPS; s++) {
      for (let i = 0; i < bodies.length; i++) {
        const b = bodies[i];
        if (b.pocketed) {
          if (b.fallingPocket) {
            b.fallTimer += dt;
            b.pos.x += (b.fallingPocket.x - b.pos.x) * 14 * dt;
            b.pos.z += (b.fallingPocket.y - b.pos.z) * 14 * dt;
            b.pos.y -= 11.0 * dt;
            if (b.fallTimer > 0.20) b.fallingPocket = null;
          }
          continue;
        }
        if (b.poised) continue;

        b.vel.y += gravity * dt;

        const speedSq = b.vel.lengthSq();
        if (speedSq > 0.08 && b.type !== 'striker') {
          b.movedThisShot = true;
        }
        const maxSpeed = 105.0;
        if (speedSq > maxSpeed * maxSpeed) {
          b.vel.multiplyScalar(maxSpeed / Math.sqrt(speedSq));
        }

        b.pos.addScaledVector(b.vel, dt);

        const wLen = b.angVel.length();
        if (wLen > 1e-5) {
          const th = wLen * dt;
          _rotAxis.copy(b.angVel).multiplyScalar(1.0 / wLen);
          b.u.applyAxisAngle(_rotAxis, th).normalize();
          b.spinYaw += b.angVel.dot(b.u) * dt;
        }
      }

      if (coins.some(c => !c.pocketed && c.poised)) {
        for (let i = 0; i < coins.length; i++) {
          const c = coins[i];
          if (c.pocketed || !c.poised) continue;
          const dx = striker.pos.x - c.pos.x;
          const dy = striker.pos.y - c.pos.y;
          const dz = striker.pos.z - c.pos.z;
          const reach = striker.radius + c.radius + 0.12;
          if (dx * dx + dy * dy + dz * dz <= reach * reach) {
            wakeTowerWithBucklingWave(striker);
            break;
          }
        }
      }

      for (let i = 0; i < bodies.length; i++) {
        const b = bodies[i];
        if (b.pocketed || b.poised) continue;
        if (b.pos.y < COIN_RADIUS * 1.35) {
          for (let pIdx = 0; pIdx < 4; pIdx++) {
            const pk = POCKETS[pIdx];
            const dx = b.pos.x - pk.x;
            const dz = b.pos.z - pk.y;
            if (dx * dx + dz * dz < (POCKET_RADIUS * 0.86) * (POCKET_RADIUS * 0.86)) {
              b.pocketed = true;
              b.fallingPocket = pk;
              b.fallTimer = 0;
              state.pocketedEvents.push({ coin: b, pocketIdx: pIdx });
              sfx.pocket(b.type === 'queen', b.type === 'striker');
              break;
            }
          }
        }
      }

      for (let iter = 0; iter < 3; iter++) {
        for (let i = 0; i < bodies.length; i++) {
          const b = bodies[i];
          if (b.pocketed || b.poised) continue;

          const uy = Math.max(-1.0, Math.min(1.0, b.u.y));
          const absUy = Math.abs(uy);
          const extY = b.halfH * absUy + b.radius * Math.sqrt(Math.max(0.0, 1.0 - uy * uy));
          const yMin = b.pos.y - extY;

          if (yMin < 0.0) {
            b.pos.y -= yMin;
            if (b.vel.y < 0.0) {
              b.vel.y = -b.vel.y * (-b.vel.y > 2.0 ? 0.22 : 0.0);
            }

            if (iter === 0) {
              if (absUy < 0.985) {
                const signY = uy >= 0 ? 1.0 : -1.0;
                _rightAxis.set(-b.u.z * signY, 0, b.u.x * signY);
                const rLen = _rightAxis.length();
                if (rLen > 1e-5) {
                  b.angVel.addScaledVector(_rightAxis.multiplyScalar(1.0 / rLen), (26.0 * dampBoost) * dt);
                }
              } else {
                b.u.set(0, uy >= 0 ? 1.0 : -1.0, 0);
                b.angVel.x = 0;
                b.angVel.z = 0;
                b.pos.y = b.halfH;
              }

              const drag = Math.max(0.0, 1.0 - 1.85 * dampBoost * dt);
              b.vel.x *= drag;
              b.vel.z *= drag;
              b.angVel.multiplyScalar(Math.max(0.0, 1.0 - 6.5 * dampBoost * dt));
            }
          }

          const effR = b.halfH * Math.sqrt(Math.max(0.0, 1.0 - uy * uy)) + b.radius * absUy;
          const lim = BOARD_HALF - effR;

          if (b.pos.x > lim) {
            b.pos.x = lim;
            if (b.vel.x > 0) {
              if (iter === 0 && soundBudget > 0 && b.vel.x > 2.0) { sfx.rail(b.vel.x / 25); soundBudget--; }
              b.vel.x = -b.vel.x * 0.84;
            }
          } else if (b.pos.x < -lim) {
            b.pos.x = -lim;
            if (b.vel.x < 0) {
              if (iter === 0 && soundBudget > 0 && -b.vel.x > 2.0) { sfx.rail(-b.vel.x / 25); soundBudget--; }
              b.vel.x = -b.vel.x * 0.84;
            }
          }

          if (b.pos.z > lim) {
            b.pos.z = lim;
            if (b.vel.z > 0) {
              if (iter === 0 && soundBudget > 0 && b.vel.z > 2.0) { sfx.rail(b.vel.z / 25); soundBudget--; }
              b.vel.z = -b.vel.z * 0.84;
            }
          } else if (b.pos.z < -lim) {
            b.pos.z = -lim;
            if (b.vel.z < 0) {
              if (iter === 0 && soundBudget > 0 && -b.vel.z > 2.0) { sfx.rail(-b.vel.z / 25); soundBudget--; }
              b.vel.z = -b.vel.z * 0.84;
            }
          }
        }

        for (let i = 0; i < bodies.length; i++) {
          const A = bodies[i];
          if (A.pocketed) continue;
          for (let j = i + 1; j < bodies.length; j++) {
            const B = bodies[j];
            if (B.pocketed) continue;
            if (A.poised && B.poised) continue;

            const pen = testCylinderSAT(A, B);
            if (pen <= 0) continue;

            A.poised = false;
            B.poised = false;
            if (A.type !== 'striker') A.movedThisShot = true;
            if (B.type !== 'striker') B.movedThisShot = true;

            const nx = _satNormal.x, ny = _satNormal.y, nz = _satNormal.z;
            const totIM = A.invMass + B.invMass;

            const ca = pen * (A.invMass / totIM);
            const cb = pen * (B.invMass / totIM);
            A.pos.x -= nx * ca; A.pos.y -= ny * ca; A.pos.z -= nz * ca;
            B.pos.x += nx * cb; B.pos.y += ny * cb; B.pos.z += nz * cb;

            if (iter === 0 && (Math.abs(A.u.y) < 0.90 || Math.abs(B.u.y) < 0.90)) {
              const hx = B.pos.x - A.pos.x;
              const hz = B.pos.z - A.pos.z;
              const hLen = Math.hypot(hx, hz);
              if (hLen > 1e-4) {
                const push = 4.0 * dt / hLen;
                A.vel.x -= hx * push; A.vel.z -= hz * push;
                B.vel.x += hx * push; B.vel.z += hz * push;
              }
            }

            computeContactPoint(A, B, nx, ny, nz);
            _rA.subVectors(_contactPt, A.pos);
            _rB.subVectors(_contactPt, B.pos);

            _vA.crossVectors(A.angVel, _rA).add(A.vel);
            _vB.crossVectors(B.angVel, _rB).add(B.vel);
            _vRel.subVectors(_vB, _vA);

            const vn = _vRel.x * nx + _vRel.y * ny + _vRel.z * nz;
            if (vn < 0) {
              if (iter === 0 && -vn > 1.5 && soundBudget > 0) {
                sfx.clack(Math.min(1.0, -vn / 22.0), (A.type === 'striker' || B.type === 'striker') ? 0.88 : 1.12);
                soundBudget--;
              }

              _rnA.crossVectors(_rA, _satNormal);
              _rnB.crossVectors(_rB, _satNormal);
              const denom = totIM + A.invI * _rnA.lengthSq() + B.invI * _rnB.lengthSq();
              const e = (-vn > 1.2) ? 0.86 : 0.15;
              const jImp = -(1.0 + e) * vn / denom;

              _imp.set(nx * jImp, ny * jImp, nz * jImp);
              A.vel.addScaledVector(_imp, -A.invMass);
              B.vel.addScaledVector(_imp, B.invMass);

              _rnA.crossVectors(_rA, _imp);
              _rnB.crossVectors(_rB, _imp);
              A.angVel.addScaledVector(_rnA, -A.invI);
              B.angVel.addScaledVector(_rnB, B.invI);

              _tang.copy(_vRel).addScaledVector(_satNormal, -vn);
              const tLen = _tang.length();
              if (tLen > 1e-5) {
                _tang.multiplyScalar(1.0 / tLen);
                const jt = Math.min(0.30 * jImp, (tLen / denom) * 0.5);
                _imp.copy(_tang).multiplyScalar(-jt);
                A.vel.addScaledVector(_imp, -A.invMass);
                B.vel.addScaledVector(_imp, B.invMass);
                _rnA.crossVectors(_rA, _imp);
                _rnB.crossVectors(_rB, _imp);
                A.angVel.addScaledVector(_rnA, -A.invI);
                B.angVel.addScaledVector(_rnB, B.invI);
              }
            }
          }
        }
      }
    }

    let activeMotion = 0;
    for (let i = 0; i < bodies.length; i++) {
      const b = bodies[i];
      b.syncMesh();
      if (b.pocketed) {
        if (b.fallingPocket) activeMotion++;
        continue;
      }
      if (b.poised) continue;

      const vSq = b.vel.lengthSq();
      const wSq = b.angVel.lengthSq();
      if (vSq > 0.02 || wSq > 0.08) {
        activeMotion++;
      } else {
        b.vel.set(0, 0, 0);
        b.angVel.set(0, 0, 0);
      }
    }

    if (activeMotion === 0 || state.shotElapsed >= 3.8) {
      if (state.shotElapsed >= 3.8) {
        for (let i = 0; i < bodies.length; i++) {
          const b = bodies[i];
          if (!b.pocketed && !b.poised) {
            b.vel.set(0, 0, 0);
            b.angVel.set(0, 0, 0);
            if (Math.abs(b.u.y) < 0.98) {
              b.u.set(0, 1, 0);
              b.pos.y = b.halfH;
            }
            b.syncMesh();
          }
        }
      }
      state.settleFrames++;
      if (state.settleFrames >= 8 || state.shotElapsed >= 3.8) {
        evaluatePlotCapturesAndTurn();
      }
    } else {
      state.settleFrames = 0;
    }
  }

  // =========================================================================
  // 15. CAMERA ORBIT, PAN, +20% ZOOM OUT & UNCONVENTIONAL-ANGLE STRIKE AIMING
  // =========================================================================
  const camTarget = new THREE.Vector3(0, 0.8, 0);
  const camGoal = new THREE.Vector3();

  function applyPanDelta(screenDX, screenDY) {
    const cosY = Math.cos(state.camYaw);
    const sinY = Math.sin(state.camYaw);
    const panScale = 0.032 * state.camZoom;
    state.panTarget.x -= (screenDX * cosY + screenDY * sinY) * panScale;
    state.panTarget.z -= (-screenDX * sinY + screenDY * cosY) * panScale;
    state.panTarget.x = Math.max(-16.0, Math.min(16.0, state.panTarget.x));
    state.panTarget.z = Math.max(-16.0, Math.min(16.0, state.panTarget.z));
  }

  function updateCamera(dt) {
    const w = Math.max(1, window.innerWidth);
    const h = Math.max(1, window.innerHeight);
    const aspect = w / h;

    const aspectScale = aspect < 0.85 ? (0.85 / Math.max(0.42, aspect)) * 0.94 : 1.0;
    const radius = 31.0 * state.camZoom * aspectScale;

    const pitch = Math.max(0.24, Math.min(1.44, state.camPitch));
    const horizDist = radius * Math.cos(pitch);
    const height = radius * Math.sin(pitch);

    camTarget.lerp(state.panTarget, Math.min(1.0, dt * 14.0));

    camGoal.set(
      camTarget.x + Math.sin(state.camYaw) * horizDist,
      camTarget.y + height,
      camTarget.z + Math.cos(state.camYaw) * horizDist
    );

    camera.position.lerp(camGoal, Math.min(1.0, dt * 14.0));
    camera.lookAt(camTarget);
  }

  const pointers = new Map();
  let dragStartScreen = { x: 0, y: 0 };
  let isAimingShot = false;
  let lastPinchDist = 0;
  let lastPinchMid = { x: 0, y: 0 };

  canvas.addEventListener('contextmenu', (e) => e.preventDefault());

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    sfx.init();
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, button: e.button });

    if (pointers.size === 2) {
      isAimingShot = false;
      document.getElementById('power-hud').classList.remove('visible');
      const pts = Array.from(pointers.values());
      lastPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      lastPinchMid.x = (pts[0].x + pts[1].x) * 0.5;
      lastPinchMid.y = (pts[0].y + pts[1].y) * 0.5;
      return;
    }

    if (pointers.size === 1 && state.inputMode === 'STRIKE' && state.phase === 'IDLE' && e.button === 0) {
      isAimingShot = true;
      dragStartScreen.x = e.clientX;
      dragStartScreen.y = e.clientY;
      state.shotCancelled = true;
      state.pullDist = 0;
      document.getElementById('power-hud').classList.add('visible');
      updatePowerHUD();
      updateAimGuide();
    }
  }, { passive: false });

  canvas.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) return;
    const prev = pointers.get(e.pointerId);
    const dx = e.clientX - prev.x;
    const dy = e.clientY - prev.y;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, button: prev.button });

    if (pointers.size === 2) {
      const pts = Array.from(pointers.values());
      const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      const midX = (pts[0].x + pts[1].x) * 0.5;
      const midY = (pts[0].y + pts[1].y) * 0.5;

      if (lastPinchDist > 10) {
        state.camZoom = Math.max(0.62, Math.min(1.70, state.camZoom * (lastPinchDist / Math.max(10, dist))));
      }
      applyPanDelta(midX - lastPinchMid.x, midY - lastPinchMid.y);

      lastPinchDist = dist;
      lastPinchMid.x = midX;
      lastPinchMid.y = midY;
      return;
    }

    if ((state.inputMode === 'PAN' || prev.button === 1 || prev.button === 2) && pointers.size === 1) {
      applyPanDelta(dx, dy);
      return;
    }

    if (state.inputMode === 'VIEW' && pointers.size === 1) {
      state.camYaw -= dx * 0.0075;
      state.camPitch = Math.max(0.24, Math.min(1.44, state.camPitch + dy * 0.006));
      return;
    }

    if (state.inputMode === 'STRIKE' && isAimingShot && pointers.size === 1 && state.phase === 'IDLE') {
      const totalScreenDX = e.clientX - dragStartScreen.x;
      const totalScreenDY = e.clientY - dragStartScreen.y;

      const cosY = Math.cos(state.camYaw);
      const sinY = Math.sin(state.camYaw);

      const scaleToBoard = 4.2 / Math.max(240, Math.min(window.innerWidth, window.innerHeight));
      const dragBoardX = (totalScreenDX * cosY + totalScreenDY * sinY) * scaleToBoard;
      const dragBoardZ = (-totalScreenDX * sinY + totalScreenDY * cosY) * scaleToBoard;

      const pullLen = Math.hypot(dragBoardX, dragBoardZ);
      state.pullDist = pullLen;

      if (pullLen < CANCEL_PULL_DIST) {
        state.shotCancelled = true;
        updatePowerHUD();
        updateAimGuide();
        return;
      }

      state.shotCancelled = false;

      // Strike is ALWAYS strictly opposite to the direction in which the player drags
      state.aimDirX = -dragBoardX / pullLen;
      state.aimDirZ = -dragBoardZ / pullLen;

      const activePull = (pullLen - CANCEL_PULL_DIST) / 2.65;
      state.aimPower = Math.max(0.12, Math.min(MAX_POWER_PCT, 0.12 + activePull * (MAX_POWER_PCT - 0.12)));

      updatePowerHUD();
      updateAimGuide();
    }
  }, { passive: false });

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    state.camZoom = Math.max(0.62, Math.min(1.70, state.camZoom + e.deltaY * 0.001));
  }, { passive: false });

  function onPointerUp(e) {
    pointers.delete(e.pointerId);
    if (isAimingShot && pointers.size === 0) {
      isAimingShot = false;
      document.getElementById('power-hud').classList.remove('visible');
      if (state.inputMode === 'STRIKE' && state.phase === 'IDLE') {
        if (state.shotCancelled) {
          sfx.tap();
          showToast('SHOT CANCELLED');
          state.shotCancelled = false;
          updateAimGuide();
        } else {
          launchStriker();
        }
      }
    }
  }

  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);

  // =========================================================================
  // 16. BOTTOM DOCK & MENU CONTROLS
  // =========================================================================
  const sliderTrack = document.getElementById('slider-track');
  let isSlidingBaseline = false;

  function updateBaselineFromPointer(clientX) {
    if (state.phase !== 'IDLE' || (state.turn === 2 && state.gameMode === 'AI')) return;
    const rect = sliderTrack.getBoundingClientRect();
    const pad = 20;
    const w = Math.max(1, rect.width - pad * 2);
    const norm = Math.max(0, Math.min(1, (clientX - rect.left - pad) / w));
    state.strikerX = norm * 2 - 1;
    placeStrikerOnBaseline();
  }

  sliderTrack.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    sfx.init();
    sliderTrack.setPointerCapture(e.pointerId);
    isSlidingBaseline = true;
    updateBaselineFromPointer(e.clientX);
  });

  sliderTrack.addEventListener('pointermove', (e) => {
    if (!isSlidingBaseline) return;
    updateBaselineFromPointer(e.clientX);
  });

  sliderTrack.addEventListener('pointerup', () => { isSlidingBaseline = false; });
  sliderTrack.addEventListener('pointercancel', () => { isSlidingBaseline = false; });

  document.getElementById('btn-pan').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    sfx.tap();
    setInputMode(state.inputMode === 'PAN' ? 'VIEW' : 'PAN');
  });

  document.getElementById('btn-mode-toggle').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (state.phase !== 'IDLE') return;
    sfx.tap();
    setInputMode(state.inputMode === 'STRIKE' ? 'VIEW' : 'STRIKE');
  });

  const menuBackdrop = document.getElementById('menu-backdrop');

  document.getElementById('btn-menu').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    sfx.tap();
    menuBackdrop.classList.add('open');
  });

  document.getElementById('btn-menu-close').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    sfx.tap();
    menuBackdrop.classList.remove('open');
  });

  menuBackdrop.addEventListener('pointerdown', (e) => {
    if (e.target === menuBackdrop) {
      sfx.tap();
      menuBackdrop.classList.remove('open');
    }
  });

  document.querySelectorAll('#seg-mode .seg-btn').forEach((btn) => {
    btn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      sfx.tap();
      document.querySelectorAll('#seg-mode .seg-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.gameMode = btn.getAttribute('data-mode');
      resetMatch();
      menuBackdrop.classList.remove('open');
    });
  });

  document.getElementById('btn-audio').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    sfx.enabled = !sfx.enabled;
    e.currentTarget.textContent = sfx.enabled ? 'SOUND: ON' : 'SOUND: OFF';
    if (sfx.enabled) sfx.tap();
  });

  document.getElementById('btn-center-cam').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    sfx.tap();
    state.panTarget.set(0, 0.8, 0);
    state.camYaw = 0;
    state.camPitch = 0.64;
    state.camZoom = 1.0;
    menuBackdrop.classList.remove('open');
  });

  document.getElementById('btn-reset').addEventListener('pointerdown', (e) => {
    e.preventDefault();
    sfx.tap();
    resetMatch();
    menuBackdrop.classList.remove('open');
  });

  function resetMatch() {
    clearTimeout(state.aiTimer);
    PLOTS.forEach(p => { p.owner = 0; });
    syncPlotVisuals();
    buyBackdrop.classList.remove('open');
    sellBackdrop.classList.remove('open');
    state.buyForced = false;
    state.turn = 1;
    state.canBuyThisTurn = true;
    state.debt = { 1: 0, 2: 0 };
    state.pendingQueenFor = 0;
    state.phase = 'IDLE';
    state.strikerX = 0;
    setInputMode('VIEW');
    setupSingleTowerRack();
    placeStrikerOnBaseline();
    updateUI();
    showToast('NEW MATCH // PLOTS RESET');
  }

  // =========================================================================
  // 17. RESIZE, ANDROID GPU RECOVERY & MAIN RENDER LOOP
  // =========================================================================
  function handleResize() {
    const w = Math.max(1, window.innerWidth);
    const h = Math.max(1, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    placeStrikerOnBaseline();
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', handleResize);
  window.addEventListener('pageshow', handleResize);
  window.addEventListener('focus', handleResize);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') handleResize();
  });

  setupSingleTowerRack();
  syncPlotVisuals();
  handleResize();
  updateUI();

  let lastTime = performance.now();
  function animate(now) {
    requestAnimationFrame(animate);
    const dt = Math.min(0.05, Math.max(0.001, (now - lastTime) * 0.001));
    lastTime = now;

    if (state.inputMode === 'STRIKE' && state.phase === 'IDLE') {
      updateAimGuide(now * 0.001);
    }

    stepPhysics(dt);
    updateCamera(dt);
    renderer.render(scene, camera);
  }

  requestAnimationFrame(animate);
})();
</script>
</body>
</html>
